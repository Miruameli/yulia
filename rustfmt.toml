# rustfmt configuration.
#
# Deliberately limited to options that are stable on the pinned stable
# toolchain. Nightly-only options (`imports_granularity`, `group_imports`,
# `wrap_comments`, ...) are intentionally NOT used: `cargo fmt --check` in CI
# and `cargo fmt` on a contributor machine must produce identical output.
# See CONTRIBUTING.md §Formatting.

edition = "2024"

# Width
max_width = 100
tab_spaces = 4
hard_tabs = false
newline_style = "Unix"

# Imports: keep them deterministic and grouped by the formatter.
reorder_imports = true
reorder_modules = true

# Idiomatic shorthand.
use_field_init_shorthand = true
use_try_shorthand = true

# Arrays/short expressions stay on one line when they fit.
short_array_element_width_threshold = 10
