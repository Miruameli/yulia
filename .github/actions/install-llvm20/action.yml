name: Install LLVM 20
description: >-
  Installs LLVM 20 from apt.llvm.org and exports LLVM_SYS_201_PREFIX, which
  llvm-sys (inkwell) uses to locate llvm-config.

runs:
  using: composite
  steps:
    - name: Add the LLVM 20 apt repository
      shell: bash
      run: |
        set -euo pipefail
        # `timeout-minutes` is a workflow-JOB key, not a valid composite-step
        # key, so the per-step bound lives inside the script instead
        # (SOP-GHOP.8 / SOP-RESLIM.2).
        # Residual supply-chain risk: the apt.llvm.org GPG key is fetched over
        # HTTPS and trusted directly rather than pinned to a known fingerprint.
        codename="$(lsb_release -cs)"
        timeout 600 wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
          | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
        echo "deb http://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-20 main" \
          | sudo tee /etc/apt/sources.list.d/llvm20.list
        timeout 600 sudo apt-get update
    - name: Install LLVM 20
      shell: bash
      # llvm-sys links statically and asks llvm-config for `--libnames
      # --link-static`, which lists libPolly.a; llvm-20-dev alone does not
      # ship it, so the link fails with "could not find native static library
      # 'Polly'". libpolly-20-dev comes from the same apt.llvm.org repo and
      # the same 20.1.8 build, so the ABI matches.
      run: timeout 600 sudo apt-get install -y --no-install-recommends llvm-20-dev libpolly-20-dev
    - name: Export LLVM_SYS_201_PREFIX
      shell: bash
      run: echo "LLVM_SYS_201_PREFIX=/usr/lib/llvm-20" >> "$GITHUB_ENV"
    - name: Verify llvm-config
      shell: bash
      run: |
        set -euo pipefail
        # Debian installs the unversioned `llvm-config` only under
        # /usr/lib/llvm-<ver>/bin; /usr/bin carries versioned names, so the
        # prefix -- not PATH -- is what llvm-sys resolves.
        cfg="${LLVM_SYS_201_PREFIX:-/usr/lib/llvm-20}/bin/llvm-config"
        test -x "$cfg"
        version="$("$cfg" --version)"
        echo "llvm-config ($cfg): $version"
        case "$version" in
          20.*) ;;
          *) echo "expected LLVM 20.x, got $version" >&2; exit 1 ;;
        esac
        # llvm-sys links statically and resolves libPolly.a through
        # `llvm-config --libnames --link-static`; assert the archive the linker
        # will be pointed at is actually present.
        libdir="$("$cfg" --libdir)"
        polly="$libdir/libPolly.a"
        test -f "$polly"
        echo "libPolly: $polly"
