# cargo-deny configuration.
# Install: `cargo install cargo-deny`
#
# The project licence is MPL-2.0 (see LICENSE). Dependencies must be
# MPL-2.0-compatible; the allow-list below is the set of common permissive and
# weak-copyleft licences that satisfy that.

[graph]
targets = [
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-unknown-linux-gnu" },
]

[advisories]
yanked = "deny"
ignore = []

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"

[licenses]
allow = [
    "MPL-2.0",
    "Apache-2.0",
    # LLVM bindings (inkwell) commonly carry this exception.
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
