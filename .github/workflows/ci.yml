name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # SOP-RESLIM.2: bound cargo's parallel build jobs to min(2, nproc/2).
  CARGO_BUILD_JOBS: 2

# The repository's remote is https://github.com/Miruameli/yulia, so these jobs
# run on every push to `main` and on every pull request.

# SOP-RESLIM: every job AND every step carries an explicit `timeout-minutes`;
# `concurrency` cancels superseded runs; nothing is uploaded, so there is no
# artifact/cache growth to bound. `ubuntu-latest` (4 vCPU / 7 GB) is sized for
# these jobs — the crate is small and no job is memory-heavy today. If a job
# grows, pin a larger runner here and record the reason.

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Pinned to a full-length commit SHA; no mutable tag is used.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # `cargo --version` makes rustup install the toolchain pinned in
      # rust-toolchain.toml (including the rustfmt component).
      - name: Install pinned toolchain
        run: cargo --version
        timeout-minutes: 5
      - run: cargo fmt --all -- --check
        timeout-minutes: 5

  lint:
    name: Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Phase 1b links LLVM through inkwell; llvm-sys needs llvm-config.
      - uses: ./.github/actions/install-llvm20
      - name: Install pinned toolchain
        run: cargo --version
        timeout-minutes: 5
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
        timeout-minutes: 5

  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/install-llvm20
      - name: Install pinned toolchain
        run: cargo --version
        timeout-minutes: 5
      # SOP-RESLIM.2: bound the test harness too; libtest defaults to num_cpus.
      - run: cargo test --workspace --all-features -- --test-threads=2
        timeout-minutes: 5

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/install-llvm20
      - name: Install pinned toolchain
        run: cargo --version
        timeout-minutes: 5
      - run: cargo build --workspace --all-features --release
        timeout-minutes: 10

  deny:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install pinned toolchain
        run: cargo --version
        timeout-minutes: 5
      # `--version` pins the tool itself; `--locked` only pins its own deps.
      - run: cargo install --locked cargo-deny --version 0.20.2
        timeout-minutes: 15
      - run: cargo deny --config deny.toml check
        timeout-minutes: 5

  typos:
    name: Spell check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: cargo install --locked typos-cli --version 1.52.1
        timeout-minutes: 15
      - run: typos
        timeout-minutes: 5

  codegraph:
    name: Codegraph index
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install pinned toolchain
        run: cargo --version
        timeout-minutes: 5
      # The package is `@colbymchenry/codegraph` (the bare name `codegraph` on
      # npm is an unrelated package).
      - name: Install codegraph
        run: npm install --global @colbymchenry/codegraph@1.6.2
        timeout-minutes: 5
      - name: Init and build the index
        # `init` is required on a fresh checkout: `.codegraph/` is not committed.
        # `--yes` makes it non-interactive (CI has no TTY).
        run: codegraph init --yes
        timeout-minutes: 10
